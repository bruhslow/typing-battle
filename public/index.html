<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type Sprint</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --ink: #17221f;
      --muted: #6d7b75;
      --paper: #f6f5ef;
      --panel: #fffdf8;
      --line: #d8ded5;
      --mint: #b7e4c7;
      --mint-strong: #2d8a62;
      --coral: #f28f79;
      --coral-dark: #bd5945;
      --shadow: 0 20px 60px rgba(32, 55, 44, 0.11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: 'Space Grotesk', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: .48;
      background-image: linear-gradient(rgba(45, 138, 98, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(45, 138, 98, .07) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    .shell {
      width: min(880px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 52px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; color: var(--panel); background: var(--ink); font-family: 'DM Mono', monospace; }
    .profile { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .profile label { margin: 0; color: var(--muted); font-size: 11px; }
    .profile input { width: 145px; padding: 8px 10px; font-size: 12px; }
    .friend-id { color: var(--ink); font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; }
    .friend-id strong { color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .connection { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .connection::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
    .connection.online::before { background: var(--mint-strong); }

    main { animation: rise .55s ease-out both; }
    .eyebrow { color: var(--mint-strong); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 620px; margin: 12px 0 16px; font-size: clamp(42px, 8vw, 76px); line-height: .97; letter-spacing: -.055em; }
    .intro { max-width: 520px; margin: 0 0 34px; color: var(--muted); font-size: 17px; line-height: 1.55; }

    .panel { padding: clamp(22px, 5vw, 42px); border: 1px solid rgba(216, 222, 213, .9); border-radius: 14px; background: rgba(255, 253, 248, .9); box-shadow: var(--shadow); }
    .hidden { display: none !important; }
    label { display: block; margin-bottom: 9px; font-size: 13px; font-weight: 600; }
    .join-row { display: flex; gap: 10px; }
    input, textarea, button { font: inherit; }
    input { width: 100%; min-width: 0; padding: 15px 16px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; outline: none; }
    input:focus, textarea:focus { border-color: var(--mint-strong); box-shadow: 0 0 0 3px rgba(45, 138, 98, .14); }
    button { border: 0; border-radius: 8px; padding: 0 22px; color: white; background: var(--ink); cursor: pointer; font-weight: 600; white-space: nowrap; }
    button:hover { background: var(--mint-strong); }
    button.secondary { margin-top: 18px; padding: 11px 18px; color: var(--ink); background: transparent; border: 1px solid var(--line); font-size: 13px; }
    .message { min-height: 20px; margin: 12px 0 0; color: var(--coral-dark); font-size: 13px; }
    .mode-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 24px; }
    .mode-button { min-height: 44px; padding: 8px 10px; color: var(--muted); background: #eef2ec; border: 1px solid transparent; font-size: 12px; }
    .mode-button.active { color: var(--ink); background: var(--mint); border-color: var(--mint-strong); }
    .private-fields { display: none; }
    .private-fields.visible { display: block; }
    .difficulty-select { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; font: inherit; }
    .room-actions { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }

    .status-line { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin-bottom: 28px; }
    .status-line h2 { margin: 0; font-size: 22px; }
    .room-label { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 12px; }
    .waiting { padding: 30px 0 12px; text-align: center; color: var(--muted); }
    .pulse { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: var(--coral); animation: pulse 1.4s infinite; }

    .race-copy { margin: 0 0 24px; padding: 22px; border-left: 4px solid var(--mint-strong); border-radius: 0 8px 8px 0; color: var(--muted); background: #f0f5ee; font-family: 'DM Mono', monospace; font-size: 16px; line-height: 1.8; }
    .race-copy .typed { color: var(--mint-strong); }
    textarea { display: block; width: 100%; min-height: 120px; resize: vertical; padding: 16px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; outline: none; font-family: 'DM Mono', monospace; line-height: 1.6; }
    .bars { display: grid; gap: 18px; margin-top: 30px; }
    .bar-head { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 13px; }
    .bar-head span:last-child { color: var(--muted); font-family: 'DM Mono', monospace; }
    .track { height: 10px; overflow: hidden; border-radius: 5px; background: #e3e9e1; }
    .fill { height: 100%; width: 0; border-radius: inherit; transition: width .16s ease-out; }
    .you-fill { background: var(--mint-strong); }
    .opponent-fill { background: var(--coral); }

    .winner { text-align: center; }
    .winner-badge { display: inline-grid; place-items: center; width: 68px; height: 68px; margin-bottom: 18px; border-radius: 50%; color: var(--panel); background: var(--coral); font-size: 30px; }
    .winner h2 { margin: 0 0 10px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -.04em; }
    .winner p { margin: 0 0 28px; color: var(--muted); }
    .winner button { min-height: 46px; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.75); } }
    @media (max-width: 600px) { header { align-items: flex-start; flex-wrap: wrap; margin-bottom: 38px; } .profile { order: 3; width: 100%; } .profile input { flex: 1; } }
    @media (max-width: 520px) { .join-row { flex-direction: column; } button { min-height: 48px; } .status-line { align-items: flex-start; flex-direction: column; gap: 7px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark">TS</span> Type Sprint</div>
      <div class="profile"><label for="username-input">Username</label><input id="username-input" maxlength="24" placeholder="Your name" autocomplete="nickname"></div>
      <div class="friend-id"><strong>Room code</strong> <span id="friend-id">Connecting...</span></div>
      <div class="connection" id="connection">Connecting</div>
    </header>

    <main>
      <section id="join-screen">
        <div class="eyebrow">Two-player typing race</div>
        <h1>Fast fingers.<br>Clear mind.</h1>
        <p class="intro">Race a random opponent, climb the ranked ladder, or host a private room for a friend.</p>
        <div class="panel">
          <div class="mode-switch" role="group" aria-label="Race mode">
            <button class="mode-button active" data-mode="quick" type="button">Quick match</button>
            <button class="mode-button" data-mode="ranked" type="button">Ranked</button>
            <button class="mode-button" data-mode="private" type="button">Private room</button>
          </div>
          <div class="private-fields" id="private-fields">
          <label for="friend-input">Enter room code</label>
          <div class="join-row">
            <input id="friend-input" maxlength="6" placeholder="ABC123" autocomplete="off">
            <button id="join-button" type="button">Join friend</button>
          </div>
          <button class="secondary" id="create-room-button" type="button">Create a room</button>
          </div>
          <button id="random-button" type="button">Find a player</button>
          <p class="message" id="join-message" aria-live="polite"></p>
        </div>
      </section>

      <section id="race-screen" class="panel hidden">
        <div class="status-line">
          <h2 id="race-status">Waiting for a rival</h2>
          <span class="room-label" id="room-label"></span>
        </div>
        <div id="waiting" class="waiting"><span class="pulse"></span><span id="waiting-message">Looking for another player...</span><div class="room-actions"><select class="difficulty-select hidden" id="difficulty-select" aria-label="Room difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><button class="secondary hidden" id="start-room-button" type="button">Start room</button><button class="secondary" id="cancel-button" type="button">Leave</button></div></div>
        <div id="race-content" class="hidden">
          <p class="race-copy" id="paragraph"></p>
          <textarea id="typing-area" disabled placeholder="Start typing when the race begins..."></textarea>
          <div class="bars">
            <div>
              <div class="bar-head"><span id="you-name">You</span><span id="you-percent">0%</span></div>
              <div class="track"><div class="fill you-fill" id="you-fill"></div></div>
            </div>
            <div>
              <div class="bar-head"><span id="opponent-name">Opponent</span><span id="opponent-percent">0%</span></div>
              <div class="track"><div class="fill opponent-fill" id="opponent-fill"></div></div>
            </div>
          </div>
        </div>
      </section>

      <section id="winner-screen" class="panel winner hidden">
        <div class="winner-badge">★</div>
        <h2 id="winner-title">You win!</h2>
        <p id="winner-subtitle">That was a clean finish.</p>
        <button id="new-race-button" type="button">Race again</button>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const joinScreen = document.querySelector('#join-screen');
    const raceScreen = document.querySelector('#race-screen');
    const winnerScreen = document.querySelector('#winner-screen');
    const joinMessage = document.querySelector('#join-message');
    const usernameInput = document.querySelector('#username-input');
    const friendInput = document.querySelector('#friend-input');
    const typingArea = document.querySelector('#typing-area');
    const paragraphElement = document.querySelector('#paragraph');
    const raceStatus = document.querySelector('#race-status');
    const waiting = document.querySelector('#waiting');
    const raceContent = document.querySelector('#race-content');
    const connection = document.querySelector('#connection');
    const friendIdElement = document.querySelector('#friend-id');
    const waitingMessage = document.querySelector('#waiting-message');
    const youName = document.querySelector('#you-name');
    const opponentName = document.querySelector('#opponent-name');
    const difficultySelect = document.querySelector('#difficulty-select');
    const startRoomButton = document.querySelector('#start-room-button');
    const privateFields = document.querySelector('#private-fields');
    const randomButton = document.querySelector('#random-button');
    let selectedMode = 'quick';
    let isHost = false;
    let roomId = '';
    let paragraph = '';
    let finished = false;

    function showScreen(screen) {
      [joinScreen, raceScreen, winnerScreen].forEach((item) => item.classList.add('hidden'));
      screen.classList.remove('hidden');
    }

    function setProgress(element, label, value) {
      const percent = Math.max(0, Math.min(100, value));
      element.style.width = percent + '%';
      label.textContent = Math.round(percent) + '%';
    }

    function renderParagraph(typedText) {
      const safeLength = Math.min(typedText.length, paragraph.length);
      paragraphElement.innerHTML = '<span class="typed">' + paragraph.slice(0, safeLength) + '</span>' + paragraph.slice(safeLength);
    }

    document.querySelectorAll('.mode-button').forEach((button) => button.addEventListener('click', () => {
      selectedMode = button.dataset.mode;
      document.querySelectorAll('.mode-button').forEach((item) => item.classList.toggle('active', item === button));
      privateFields.classList.toggle('visible', selectedMode === 'private');
      randomButton.classList.toggle('hidden', selectedMode === 'private');
    }));

    document.querySelector('#join-button').addEventListener('click', () => {
      const friendId = friendInput.value.trim().toUpperCase();
      const username = usernameInput.value.trim();
      if (!username || !friendId) {
        joinMessage.textContent = username ? 'Enter your friend ID to continue.' : 'Choose a username to continue.';
        (username ? friendInput : usernameInput).focus();
        return;
      }
      joinMessage.textContent = '';
      socket.emit('joinFriendRoom', { friendId, username });
    });

    randomButton.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      if (!username) {
        joinMessage.textContent = 'Choose a username to continue.';
        usernameInput.focus();
        return;
      }
      joinMessage.textContent = '';
      socket.emit('findMatch', { username, mode: selectedMode });
    });

    friendInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') document.querySelector('#join-button').click();
    });

    usernameInput.addEventListener('change', () => socket.emit('setUsername', usernameInput.value));

    document.querySelector('#create-room-button').addEventListener('click', () => {
      const username = usernameInput.value.trim();
      if (!username) {
        joinMessage.textContent = 'Choose a username to continue.';
        usernameInput.focus();
        return;
      }
      socket.emit('createFriendRoom', { username, difficulty: difficultySelect.value });
    });

    difficultySelect.addEventListener('change', () => socket.emit('setRoomDifficulty', difficultySelect.value));
    startRoomButton.addEventListener('click', () => socket.emit('startRoom'));

    document.querySelector('#cancel-button').addEventListener('click', () => {
      socket.emit('cancelMatch');
      socket.emit('leaveRoom');
      showScreen(joinScreen);
    });

    typingArea.addEventListener('input', () => {
      const progress = paragraph ? Math.min(100, (typingArea.value.length / paragraph.length) * 100) : 0;
      renderParagraph(typingArea.value);
      setProgress(document.querySelector('#you-fill'), document.querySelector('#you-percent'), progress);
      socket.emit('progress', progress);
      if (typingArea.value === paragraph && !finished) {
        finished = true;
        socket.emit('finished');
      }
    });

    document.querySelector('#new-race-button').addEventListener('click', () => {
      window.location.reload();
    });

    socket.on('connect', () => {
      connection.textContent = 'Connected';
      connection.classList.add('online');
    });

    socket.on('friendId', (friendId) => {
      friendIdElement.textContent = friendId;
    });

    socket.on('friendRoomCreated', ({ friendId }) => {
      isHost = true;
      showScreen(raceScreen);
      raceStatus.textContent = 'Waiting for your friend';
      document.querySelector('#room-label').textContent = 'ID / ' + friendId;
      waitingMessage.textContent = 'Give your friend the room code shown in the top-right corner.';
      difficultySelect.classList.remove('hidden');
      startRoomButton.classList.add('hidden');
      joinMessage.textContent = '';
    });

    socket.on('friendJoined', ({ players }) => {
      const opponent = players.find((item) => item.id !== socket.id);
      if (opponent) waitingMessage.textContent = opponent.username + ' joined. Starting race...';
      if (isHost) startRoomButton.classList.remove('hidden');
    });

    socket.on('disconnect', () => {
      connection.textContent = 'Disconnected';
      connection.classList.remove('online');
    });

    socket.on('matchmaking', ({ mode, rating }) => {
      isHost = false;
      difficultySelect.classList.add('hidden');
      startRoomButton.classList.add('hidden');
      showScreen(raceScreen);
      raceStatus.textContent = mode === 'ranked' ? 'Finding a ranked player • ELO ' + rating : 'Finding a player';
      waitingMessage.textContent = 'Looking for another player...';
      document.querySelector('#room-label').textContent = '';
      joinMessage.textContent = '';
    });

    socket.on('matchFound', ({ roomId: matchedRoomId, opponent }) => {
      roomId = matchedRoomId;
      raceStatus.textContent = 'Opponent found';
      document.querySelector('#room-label').textContent = 'MATCH / ' + roomId;
      waitingMessage.textContent = 'Starting your race against ' + opponent.username + '...';
    });

    socket.on('joinedRoom', ({ playerNumber, username }) => {
      roomId = 'manual-room';
      showScreen(raceScreen);
      document.querySelector('#room-label').textContent = 'ROOM / ' + roomId;
      youName.textContent = username || 'You';
      raceStatus.textContent = playerNumber === 1 ? 'Waiting for a rival' : 'Getting the race ready';
      joinMessage.textContent = '';
    });

    socket.on('raceStarted', ({ paragraph: sharedParagraph, players = [] }) => {
      paragraph = sharedParagraph;
      finished = false;
      const player = players.find((item) => item.id === socket.id);
      const opponent = players.find((item) => item.id !== socket.id);
      youName.textContent = player ? player.username : 'You';
      opponentName.textContent = opponent ? opponent.username : 'Opponent';
      raceStatus.textContent = 'Type to race';
      difficultySelect.classList.add('hidden');
      startRoomButton.classList.add('hidden');
      waiting.classList.add('hidden');
      raceContent.classList.remove('hidden');
      typingArea.value = '';
      typingArea.disabled = false;
      typingArea.focus();
      renderParagraph('');
      setProgress(document.querySelector('#you-fill'), document.querySelector('#you-percent'), 0);
      setProgress(document.querySelector('#opponent-fill'), document.querySelector('#opponent-percent'), 0);
    });

    socket.on('opponentProgress', ({ progress }) => {
      setProgress(document.querySelector('#opponent-fill'), document.querySelector('#opponent-percent'), progress);
    });

    socket.on('raceFinished', ({ winnerId }) => {
      typingArea.disabled = true;
      const winnerName = winnerId === socket.id ? youName.textContent : opponentName.textContent;
      document.querySelector('#winner-title').textContent = winnerId === socket.id ? 'You win!' : winnerName + ' wins';
      document.querySelector('#winner-subtitle').textContent = winnerId === socket.id ? 'Your fingers found the finish line first.' : 'Your opponent crossed the finish line first.';
      showScreen(winnerScreen);
    });

    socket.on('playerLeft', () => {
      raceStatus.textContent = 'Waiting for a rival';
      waiting.classList.remove('hidden');
      raceContent.classList.add('hidden');
      typingArea.disabled = true;
      waitingMessage.textContent = 'Your opponent left. Looking for another player...';
      socket.emit('findMatch', usernameInput.value.trim());
    });

    socket.on('roomDifficulty', (difficulty) => { difficultySelect.value = difficulty; });

    socket.on('roomFull', () => { joinMessage.textContent = 'That room already has two players.'; });
    socket.on('errorMessage', (message) => { joinMessage.textContent = message; });
  </script>
</body>
</html>
